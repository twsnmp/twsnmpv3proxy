# mise configuration file for twsnmpv3proxy

[tools]
go = "1.26.2"

[tasks.build]
description = "Build the proxy binary for local OS"
run = "go build -o dist/twsnmpv3proxy"

[tasks.test]
description = "Run unit tests"
run = "go test -v ./..."

[tasks.integration]
description = "Build and run the self-contained integration test"
depends = ["build"]
run = "./dist/twsnmpv3proxy -test"

[tasks.build_windows]
description = "Build the proxy binary for Windows (AMD64)"
run = "GOOS=windows GOARCH=amd64 go build -o dist/twsnmpv3proxy.exe"

[tasks.package]
description = "Compile and package the Windows (AMD64) release files into a ZIP archive"
run = """
mkdir -p dist/build_pkg/twsnmpv3proxy
GOOS=windows
GOARCH=amd64
echo "Building and packaging for $GOOS/$GOARCH..."
GOOS=$GOOS GOARCH=$GOARCH go build -o dist/build_pkg/twsnmpv3proxy/twsnmpv3proxy.exe
cp README.md dist/build_pkg/twsnmpv3proxy/
cp LICENSE dist/build_pkg/twsnmpv3proxy/
cp config.ini.sample dist/build_pkg/twsnmpv3proxy/
cd dist/build_pkg
zip -r ../twsnmpv3proxy-$GOOS-$GOARCH.zip twsnmpv3proxy
cd ../..
rm -rf dist/build_pkg
echo "Release package created: dist/twsnmpv3proxy-$GOOS-$GOARCH.zip"
"""
